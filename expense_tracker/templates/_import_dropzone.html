<input type="hidden" name="view" value="{{ view }}">
<input type="file" name="file" id="{{ prefix }}-file" class="dropzone-input" accept=".csv,.xlsx,.xls" multiple required>
<label for="{{ prefix }}-file" class="dropzone" id="{{ prefix }}-dropzone">
  <span class="dropzone-icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
      <path d="M12 16V6.5m0 0 3.75 3.75M12 6.5 8.25 10.25" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 15.75V17a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-1.25a4.25 4.25 0 0 1 1.85-3.5 5.25 5.25 0 0 1 10.25.95A3.5 3.5 0 0 1 20 15.75Z" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
  <span class="dropzone-copy" id="{{ prefix }}-idle">
    <span class="dropzone-title">{{ t('drop_file_here') }}</span>
    <span class="dropzone-sub">{{ t('drop_file_or_browse') }}</span>
    <span class="dropzone-types">{{ t('drop_file_types') }}</span>
  </span>
  <span class="dropzone-copy hidden" id="{{ prefix }}-selected">
    <span class="dropzone-title" id="{{ prefix }}-file-name"></span>
    <span class="dropzone-sub">{{ t('change_file') }}</span>
  </span>
</label>
